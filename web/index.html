<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5c43">
  <title>Mostrador</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilos.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-hoy" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h3v3H8z"/></symbol>
    <symbol id="i-ventas" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-compras" viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-productos" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
    <symbol id="i-cartera" viewBox="0 0 24 24"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1V7z"/><path d="M4 7l11-3v3"/><path d="M15 13.5h2"/></symbol>
    <symbol id="i-caja" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="9" rx="1.5"/><path d="M6 11V5h8v6M16 8h2v3"/><path d="M8 15.5h8"/></symbol>
    <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-quitar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-atras" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  </svg>

  <div class="marco">
    <header class="lateral">
      <a class="marca" href="#/">
        <svg class="marca-signo" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-caja"/></svg>
        <span>Mostrador</span>
      </a>
      <nav class="nav" aria-label="Secciones">
        <a href="#/" data-ruta="hoy"><svg aria-hidden="true"><use href="#i-hoy"/></svg>Hoy</a>
        <a href="#/ventas" data-ruta="ventas"><svg aria-hidden="true"><use href="#i-ventas"/></svg>Ventas</a>
        <a href="#/compras" data-ruta="compras"><svg aria-hidden="true"><use href="#i-compras"/></svg>Compras</a>
        <a href="#/productos" data-ruta="productos"><svg aria-hidden="true"><use href="#i-productos"/></svg>Productos</a>
        <a href="#/cartera" data-ruta="cartera"><svg aria-hidden="true"><use href="#i-cartera"/></svg>Cartera</a>
        <a href="#/caja" data-ruta="caja"><svg aria-hidden="true"><use href="#i-caja"/></svg>Caja</a>
      </nav>
      <p class="pie-lateral">Un almacén · montos en soles</p>
    </header>

    <main id="vista" class="vista" tabindex="-1">
      <p class="cargando">Cargando…</p>
    </main>
  </div>

  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <dialog id="confirmar" class="dialogo">
    <form method="dialog">
      <h2 id="confirmar-titulo"></h2>
      <p id="confirmar-texto"></p>
      <div class="acciones">
        <button value="no" class="boton">Cancelar</button>
        <button value="si" class="boton peligro" id="confirmar-si"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
